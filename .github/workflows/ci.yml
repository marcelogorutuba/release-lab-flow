name: ci

# Called by pipeline.yml; publish needs every job here. See ci/README.md for the
# ESLint baseline and the test exceptions.

on:
  workflow_call:

# npm ci runs third-party install scripts; the token they could reach stays read-only.
permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Whole repository against eslint-suppressions.json. Warnings do not fail the job:
      # they are the rules the repository itself set to "warn".
      - name: ESLint (baseline in eslint-suppressions.json)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: evo_campaign
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["8123:8123"]
        # localhost resolves to IPv6 inside the image and ClickHouse listens on IPv4.
        options: --health-cmd "wget -qO- http://127.0.0.1:8123/ping" --health-interval 5s --health-retries 30
    env:
      # Every integration suite runs; one that skips fails the job (ci/check-test-results.mjs).
      BROKER_CONTRACT: '1'
      KAFKA_INTEGRATION: '1'
      RABBITMQ_INTEGRATION: '1'
      REDIS_INTEGRATION: '1'
      SEGMENT_E2E: '1'
      KAFKA_BROKERS: localhost:9092
      RABBITMQ_URL: amqp://admin:admin@localhost:5672
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      POSTGRES_DB_HOST: localhost
      POSTGRES_DB_PORT: '5432'
      POSTGRES_DB_USERNAME: postgres
      POSTGRES_DB_PASSWORD: password
      POSTGRES_DB_DATABASE: evo_campaign
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_DATABASE: evo_campaign
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start Kafka and RabbitMQ
        run: docker compose -f docker-compose.contract.yml up -d --wait
      - name: Create the ClickHouse schema
        run: npx ts-node --transpile-only -r tsconfig-paths/register scripts/init-clickhouse-schema.ts
      - name: Migrations on a clean database
        run: npm run build && npx typeorm migration:run -d dist/database/ormconfig.js
      # The exit codes are printed, not trusted: a known failure makes jest exit 1, and
      # the next step is the one that decides.
      - name: Run the whole suite (src and test/)
        run: |
          set +e
          mkdir -p ci-out
          npx jest --ci --maxWorkers=2 --json --outputFile=ci-out/jest.json
          echo "jest exit $?"
          npx jest --ci --config ./test/jest-e2e.json --json --outputFile=ci-out/jest-e2e.json
          echo "jest e2e exit $?"
          exit 0
      - name: Stop Kafka and RabbitMQ
        if: always()
        run: docker compose -f docker-compose.contract.yml down -v
