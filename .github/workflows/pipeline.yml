name: Pipeline

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main, "release/**"]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  guard:
    uses: ./.github/workflows/tenant-db-context-guard.yml

  publish:
    needs: [ci, guard]
    uses: marcelogorutuba/release-lab-workflows/.github/workflows/publish-image.yml@v1.4.0
    permissions:
      contents: write
      packages: write
    with:
      image: ghcr.io/marcelogorutuba/release-lab-flow
