name: Pipeline

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main, "release/**"]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/unit-tests.yml

  publish:
    needs: test
    uses: marcelogorutuba/release-lab-workflows/.github/workflows/publish-image.yml@main
    permissions:
      contents: write
      packages: write
    with:
      image: ghcr.io/marcelogorutuba/release-lab-flow
